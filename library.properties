sentence=Easy DS18B20 temperature sensor library: several sensors on one wire, non-blocking reads, parasite power, clear errors. No OneWire or DallasTemperature needed.
paragraph=Reads DS18B20 (also DS18S20 and DS1822) sensors on a 1-Wire pin with a one-line begin(): finds all sensors itself, measures them at once, checks data with CRC, supports parasite (two-wire) power and explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266 and other boards without any extra libraries. Examples included, made for classes and kits by Alash Electronics.
